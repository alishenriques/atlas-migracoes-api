# Weekly update PRs for dependencies and for the actions the workflows use.
# Each one goes through CI and Alisson's review like any other PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # vitest and its coverage provider must share a version, so a major
      # bump of one without the other breaks CI. Listed before the minor and
      # patch group so they always come together in this one.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
